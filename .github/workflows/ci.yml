name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  php-lint:
    name: PHP syntax lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: bash tests/lint.sh

  db-storage:
    name: Persistent storage guard (/data)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check_db_storage.sh

  schema:
    name: SQLite schema validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/check_schema.sh

  smoke:
    name: Page smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: bash tests/smoke_test.sh

  upgrade:
    name: In-place DB upgrade test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: bash tests/upgrade_test.sh

  audit-undo:
    name: Audit undo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: pdo_sqlite
      - run: bash tests/audit_undo_test.sh

  addon-lint:
    name: Home Assistant add-on lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: frenck/action-addon-linter@v2
        with:
          path: "./bud_addon"

  docker-persistence:
    name: Docker /data persistence test
    runs-on: ubuntu-latest
    needs: [php-lint, db-storage]
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/docker_persistence_test.sh

  docker-build-arm:
    # The add-on also ships for ARM boards (Raspberry Pi etc.); make sure the
    # image at least builds for aarch64 so a broken apk pin doesn't slip out.
    name: Docker build (aarch64)
    runs-on: ubuntu-latest
    needs: [php-lint, db-storage]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # No BUILD_FROM passed — like the Supervisor, this relies on the
      # Dockerfile's default base image (a multi-arch manifest).
      - name: Build aarch64 image
        run: |
          docker buildx build \
            --platform linux/arm64 \
            bud_addon
